<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Nest 2 DUCK/CV and EIS-to-SOH follow-up visual card</title>
  <desc id="desc">Public-safe visual summary of DUCK cyclic-voltammetry waveform support and NASA EIS-to-SOH improvement metrics.</desc>
  <rect width="1200" height="720" fill="#f7f4ed"/>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#121212">Nest 2 Electrochemistry: DUCK/CV + EIS-to-SOH Follow-Up</text>
  <text x="56" y="108" font-family="Arial, sans-serif" font-size="17" fill="#42413d">Real cyclic-voltammetry waveform row plus continuous impedance-to-health improvement surface</text>

  <rect x="56" y="140" width="520" height="236" rx="8" fill="#ffffff" stroke="#d6d1c6"/>
  <text x="84" y="178" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#121212">DUCK/CV waveform gate</text>
  <text x="84" y="210" font-family="Arial, sans-serif" font-size="15" fill="#42413d">201 real CV waveforms: 122 TL + 79 SDL</text>
  <line x1="84" y1="244" x2="528" y2="244" stroke="#d6d1c6"/>
  <text x="84" y="282" font-family="Arial, sans-serif" font-size="16" fill="#121212">Source/protocol AUC</text>
  <rect x="290" y="265" width="210" height="24" rx="4" fill="#2f9aa8"/>
  <text x="512" y="283" font-family="Arial, sans-serif" font-size="15" fill="#121212">1.000</text>
  <text x="84" y="322" font-family="Arial, sans-serif" font-size="16" fill="#121212">Chemistry-family balanced acc.</text>
  <rect x="290" y="305" width="190" height="24" rx="4" fill="#d9ad24"/>
  <text x="512" y="323" font-family="Arial, sans-serif" font-size="15" fill="#121212">0.907</text>
  <text x="84" y="362" font-family="Arial, sans-serif" font-size="16" fill="#121212">pH-state AUC</text>
  <rect x="290" y="345" width="185" height="24" rx="4" fill="#c5674f"/>
  <text x="512" y="363" font-family="Arial, sans-serif" font-size="15" fill="#121212">0.883</text>

  <rect x="624" y="140" width="520" height="236" rx="8" fill="#ffffff" stroke="#d6d1c6"/>
  <text x="652" y="178" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#121212">EIS-to-SOH follow-up</text>
  <text x="652" y="210" font-family="Arial, sans-serif" font-size="15" fill="#42413d">Continuous SOH separated into boundary and improvement reads</text>
  <line x1="652" y1="244" x2="1096" y2="244" stroke="#d6d1c6"/>
  <text x="652" y="282" font-family="Arial, sans-serif" font-size="16" fill="#121212">Pure EIS group holdout</text>
  <rect x="884" y="265" width="28" height="24" rx="4" fill="#8d96a3"/>
  <text x="928" y="283" font-family="Arial, sans-serif" font-size="15" fill="#121212">Pearson 0.099 / open</text>
  <text x="652" y="322" font-family="Arial, sans-serif" font-size="16" fill="#121212">EIS + cycle group holdout</text>
  <rect x="884" y="305" width="95" height="24" rx="4" fill="#d9ad24"/>
  <text x="996" y="323" font-family="Arial, sans-serif" font-size="15" fill="#121212">0.377 / p 0.003984</text>
  <text x="652" y="362" font-family="Arial, sans-serif" font-size="16" fill="#121212">Same-battery temporal</text>
  <rect x="884" y="345" width="220" height="24" rx="4" fill="#2f9aa8"/>
  <text x="1114" y="363" font-family="Arial, sans-serif" font-size="15" fill="#121212">0.876</text>

  <rect x="56" y="420" width="1088" height="220" rx="8" fill="#ffffff" stroke="#d6d1c6"/>
  <text x="84" y="458" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#121212">State / control / transform / drift / quality / support</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#121212">
    <text x="84" y="498">state: raw I-V waveform, peak structure, loop shape, EIS impedance, SOH</text>
    <text x="84" y="532">control: shuffled source, chemistry-family, pH, degradation, and SOH labels</text>
    <text x="84" y="566">transform: waveform stats + resampled trace vector; EIS features + cycle context</text>
    <text x="84" y="600">support: CV protocol, chemistry-family, pH, and temporal SOH reads clear shuffled controls</text>
  </g>
  <text x="56" y="684" font-family="Arial, sans-serif" font-size="13" fill="#6a6760">Public-safe card: raw traces, private script, and local workbench outputs remain outside this repository.</text>
</svg>
