<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Final Nest Closeout Board</title>
  <desc id="desc">Public-safe visual summarizing current Nest closeout status and the remaining hard gates.</desc>
  <rect width="1280" height="760" fill="#f7f5ef"/>
  <text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#172426">Final Nest Closeout Board</text>
  <text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#485457">Lane-by-lane closeout state: closed current level, support-bearing, pending row, access-gated, or integration layer.</text>

  <defs>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#172426}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#334246}
      .tiny{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#4b595c}
      .pct{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#172426}
      .closed{fill:#dcefe9;stroke:#83b5a5}
      .support{fill:#e4edf7;stroke:#83a5c5}
      .pending{fill:#fff0cf;stroke:#d8b45e}
      .private{fill:#efe8f5;stroke:#b39ac9}
      .integration{fill:#eef0f0;stroke:#b8c0c0}
    </style>
  </defs>

  <g transform="translate(60 145)">
    <rect width="1160" height="110" rx="8" fill="#ffffff" stroke="#d5d9d8"/>
    <text x="24" y="34" class="label">Current Endgame Read</text>
    <text x="24" y="64" class="small">The Nest is mostly mapped and mostly support-bearing. Remaining hard gates are specific, not open-ended.</text>
    <text x="24" y="88" class="small">Do not launch new broad searches unless they target a named hard gate.</text>
  </g>

  <g transform="translate(60 295)">
    <rect width="250" height="110" rx="8" class="closed"/>
    <text x="22" y="35" class="pct">90%</text>
    <text x="22" y="66" class="label">Nest lane mapping</text>
    <text x="22" y="91" class="small">route map nearly complete</text>
  </g>
  <g transform="translate(350 295)">
    <rect width="250" height="110" rx="8" class="support"/>
    <text x="22" y="35" class="pct">80%</text>
    <text x="22" y="66" class="label">Evidence closeout</text>
    <text x="22" y="91" class="small">real controls mostly seated</text>
  </g>
  <g transform="translate(640 295)">
    <rect width="250" height="110" rx="8" class="pending"/>
    <text x="22" y="35" class="pct">70-75%</text>
    <text x="22" y="66" class="label">Public-safe packaging</text>
    <text x="22" y="91" class="small">index cleanup remains</text>
  </g>
  <g transform="translate(930 295)">
    <rect width="250" height="110" rx="8" class="private"/>
    <text x="22" y="35" class="pct">65-70%</text>
    <text x="22" y="66" class="label">Product routing</text>
    <text x="22" y="91" class="small">Nest 5 integration layer</text>
  </g>

  <g transform="translate(60 455)">
    <text x="0" y="0" class="label">Closeout Status by Layer</text>
    <g transform="translate(0 28)">
      <rect width="175" height="62" rx="8" class="closed"/>
      <text x="18" y="26" class="label">AI / Mirror</text>
      <text x="18" y="47" class="tiny">closed current level</text>
    </g>
    <g transform="translate(197 28)">
      <rect width="175" height="62" rx="8" class="closed"/>
      <text x="18" y="26" class="label">Nest 1</text>
      <text x="18" y="47" class="tiny">formal support</text>
    </g>
    <g transform="translate(394 28)">
      <rect width="175" height="62" rx="8" class="support"/>
      <text x="18" y="26" class="label">Nest 2</text>
      <text x="18" y="47" class="tiny">matter/environment</text>
    </g>
    <g transform="translate(591 28)">
      <rect width="175" height="62" rx="8" class="support"/>
      <text x="18" y="26" class="label">Nest 3</text>
      <text x="18" y="47" class="tiny">physical lanes</text>
    </g>
    <g transform="translate(788 28)">
      <rect width="175" height="62" rx="8" class="private"/>
      <text x="18" y="26" class="label">Nest 4</text>
      <text x="18" y="47" class="tiny">biology + private raw</text>
    </g>
    <g transform="translate(985 28)">
      <rect width="175" height="62" rx="8" class="integration"/>
      <text x="18" y="26" class="label">Nest 5</text>
      <text x="18" y="47" class="tiny">integration layer</text>
    </g>
  </g>

  <g transform="translate(60 605)">
    <rect width="1160" height="92" rx="8" fill="#ffffff" stroke="#d5d9d8"/>
    <text x="24" y="32" class="label">Remaining Hard Gates</text>
    <text x="24" y="60" class="small">1. THz / EMF biology physical-control packet: source_on, source_off, source_disabled, heat/off-window/environment controls.</text>
    <text x="24" y="82" class="small">2. B.A.S.I.S. synchronized public-safe capture manifest. 3. Final public-safe index cleanup.</text>
  </g>

  <g transform="translate(60 724)">
    <rect x="0" y="-14" width="14" height="14" class="closed"/>
    <text x="22" y="-2" class="tiny">closed current level</text>
    <rect x="180" y="-14" width="14" height="14" class="support"/>
    <text x="202" y="-2" class="tiny">support-bearing</text>
    <rect x="340" y="-14" width="14" height="14" class="pending"/>
    <text x="362" y="-2" class="tiny">pending row</text>
    <rect x="472" y="-14" width="14" height="14" class="private"/>
    <text x="494" y="-2" class="tiny">private/raw boundary</text>
    <text x="860" y="-2" class="tiny">Boundary: routing artifact, not a new evidence row.</text>
  </g>
</svg>
