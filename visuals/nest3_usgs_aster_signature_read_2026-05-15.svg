<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Nest 3 USGS ASTER spectral signature support read</title>
  <desc id="desc">Public-safe visual summary of the Universal Data Pattern mapped into USGS ASTER spectral rows.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1c2426">Nest 3 Spectral Signature Support Read</text>
  <text x="60" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#435052">USGS Spectral Library V7 ASTER subset | 2,439 real spectra | 7 material-family states | shuffled-label controls</text>

  <g transform="translate(60 145)">
    <rect width="320" height="170" rx="8" fill="#ffffff" stroke="#cfd8d9"/>
    <text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#193135">Architecture Variables</text>
    <text x="24" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">state: material family</text>
    <text x="24" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">control: shuffled labels</text>
    <text x="24" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">transform: spectra to ASTER bands</text>
    <text x="24" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">quality: valid-band gate</text>
  </g>

  <g transform="translate(440 145)">
    <rect width="320" height="170" rx="8" fill="#ffffff" stroke="#cfd8d9"/>
    <text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#193135">Measured Substrate</text>
    <text x="24" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">USGS real reflectance spectra</text>
    <text x="24" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">ASTER 9-band compact vectors</text>
    <text x="24" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">spectral-angle centroids</text>
    <text x="24" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">250 shuffled-label controls</text>
  </g>

  <g transform="translate(820 145)">
    <rect width="320" height="170" rx="8" fill="#ffffff" stroke="#cfd8d9"/>
    <text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#193135">Support Read</text>
    <text x="24" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">real balanced accuracy: 0.5175</text>
    <text x="24" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">shuffled mean: 0.1468</text>
    <text x="24" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">p: 0.003984</text>
    <text x="24" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2c393b">Nest 3 + Nest 2 support pass</text>
  </g>

  <g transform="translate(100 390)">
    <text x="0" y="-28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#193135">Material-Family State Counts</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#263335">
      <text x="0" y="0">minerals</text>
      <rect x="170" y="-15" width="560" height="20" fill="#2f9eaa"/>
      <text x="750" y="0">1262</text>

      <text x="0" y="42">organic compounds</text>
      <rect x="170" y="27" width="160" height="20" fill="#d7a928"/>
      <text x="350" y="42">360</text>

      <text x="0" y="84">artificial materials</text>
      <rect x="170" y="69" width="129" height="20" fill="#c96f4d"/>
      <text x="319" y="84">290</text>

      <text x="0" y="126">vegetation</text>
      <rect x="170" y="111" width="127" height="20" fill="#5f9d6a"/>
      <text x="317" y="126">286</text>

      <text x="0" y="168">soils / mixtures</text>
      <rect x="170" y="153" width="92" height="20" fill="#8d8f98"/>
      <text x="282" y="168">207</text>

      <text x="0" y="210">liquids / water / ice</text>
      <rect x="170" y="195" width="16" height="20" fill="#4b78b5"/>
      <text x="206" y="210">23</text>

      <text x="0" y="252">coatings</text>
      <rect x="170" y="237" width="8" height="20" fill="#7f5ea8"/>
      <text x="198" y="252">11</text>
    </g>
  </g>

  <g transform="translate(830 390)">
    <text x="0" y="-28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#193135">Nest Plug-In</text>
    <rect x="0" y="-5" width="285" height="52" rx="8" fill="#e5f3f5" stroke="#c7dfe3"/>
    <text x="18" y="27" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#263335">Nest 3: Waves / Spectra</text>
    <rect x="0" y="72" width="285" height="52" rx="8" fill="#fff4d5" stroke="#e4cf8b"/>
    <text x="18" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#263335">Nest 2: Spectral Signatures</text>
    <rect x="0" y="149" width="285" height="52" rx="8" fill="#ede7f6" stroke="#d0c3ea"/>
    <text x="18" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#263335">Nest 5: Convergence Matrix</text>
    <rect x="0" y="226" width="285" height="52" rx="8" fill="#f1f2f2" stroke="#d0d5d6"/>
    <text x="18" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#263335">Next: native spectra / H2O / THz</text>
  </g>
</svg>
