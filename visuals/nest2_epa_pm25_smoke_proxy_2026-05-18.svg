<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">EPA PM2.5 Atmospheric Particle-State Proxy</title>
  <desc id="desc">Public-safe visual card summarizing the EPA PM2.5 particle-state row, target QA, support metrics, and control-separated recovery.</desc>
  <rect width="1200" height="680" fill="#f4f0e8"/>
  <text x="54" y="72" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#171717">EPA PM2.5: Atmospheric Particle-State Proxy</text>
  <text x="54" y="112" font-family="Arial, sans-serif" font-size="17" fill="#2c2c2c">Nest 2 environmental fate + oxygen/redox -&gt; Nest 3 particle / gas / meteorology dynamics</text>

  <g transform="translate(54 148)">
    <rect width="318" height="154" rx="8" fill="#ffffff" stroke="#d8c9b9"/>
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#202020">Target QA</text>
    <text x="24" y="70" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">69,403 support rows</text>
    <text x="24" y="96" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">442 PM2.5 monitor sites</text>
    <text x="24" y="122" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">2025-01-01 to 2025-10-30</text>
  </g>

  <g transform="translate(394 148)">
    <rect width="356" height="154" rx="8" fill="#ffffff" stroke="#d8c9b9"/>
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#202020">Particle Context</text>
    <text x="24" y="70" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">PM2.5 + ozone + NO2 + wind</text>
    <text x="24" y="96" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">CO, SO2, pressure, humidity</text>
    <text x="24" y="122" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">250 shuffled-control reads</text>
  </g>

  <g transform="translate(774 148)">
    <rect width="372" height="154" rx="8" fill="#ffffff" stroke="#d8c9b9"/>
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#202020">Support Read</text>
    <text x="24" y="70" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">site-heldout AUC 0.789010</text>
    <text x="24" y="96" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">temporal + lag AUC 0.850927</text>
    <text x="24" y="122" font-family="Arial, sans-serif" font-size="15" fill="#2a2a2a">all displayed modes p = 0.003984</text>
  </g>

  <g transform="translate(54 360)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#171717">PM2.5 Recovery: Regression Pearson</text>
    <line x1="66" y1="214" x2="594" y2="214" stroke="#7f7468" stroke-width="2"/>
    <line x1="66" y1="34" x2="66" y2="214" stroke="#7f7468" stroke-width="2"/>
    <text x="22" y="218" font-family="Arial, sans-serif" font-size="13" fill="#333">0.0</text>
    <text x="22" y="126" font-family="Arial, sans-serif" font-size="13" fill="#333">0.3</text>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="13" fill="#333">0.6</text>
    <rect x="126" y="118" width="92" height="96" fill="#8e9677"/>
    <rect x="278" y="76" width="92" height="138" fill="#369ba5"/>
    <rect x="430" y="35" width="92" height="179" fill="#215a8a"/>
    <text x="134" y="108" font-family="Arial, sans-serif" font-size="13" fill="#111">0.3181</text>
    <text x="286" y="66" font-family="Arial, sans-serif" font-size="13" fill="#111">0.4607</text>
    <text x="438" y="25" font-family="Arial, sans-serif" font-size="13" fill="#111">0.5965</text>
    <text x="112" y="246" font-family="Arial, sans-serif" font-size="13" fill="#222">geo/season</text>
    <text x="258" y="246" font-family="Arial, sans-serif" font-size="13" fill="#222">particle context</text>
    <text x="420" y="246" font-family="Arial, sans-serif" font-size="13" fill="#222">context + lag</text>
  </g>

  <g transform="translate(706 360)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#171717">High-PM2.5 AQI Class: ROC AUC</text>
    <line x1="54" y1="214" x2="384" y2="214" stroke="#7f7468" stroke-width="2"/>
    <line x1="54" y1="34" x2="54" y2="214" stroke="#7f7468" stroke-width="2"/>
    <text x="14" y="218" font-family="Arial, sans-serif" font-size="13" fill="#333">0.0</text>
    <text x="14" y="126" font-family="Arial, sans-serif" font-size="13" fill="#333">0.5</text>
    <text x="14" y="38" font-family="Arial, sans-serif" font-size="13" fill="#333">1.0</text>
    <rect x="98" y="88" width="74" height="126" fill="#8e9677"/>
    <rect x="214" y="72" width="74" height="142" fill="#369ba5"/>
    <rect x="330" y="61" width="74" height="153" fill="#215a8a"/>
    <text x="103" y="78" font-family="Arial, sans-serif" font-size="13" fill="#111">0.6982</text>
    <text x="219" y="62" font-family="Arial, sans-serif" font-size="13" fill="#111">0.7890</text>
    <text x="335" y="51" font-family="Arial, sans-serif" font-size="13" fill="#111">0.8509</text>
    <text x="76" y="246" font-family="Arial, sans-serif" font-size="13" fill="#222">geo</text>
    <text x="192" y="246" font-family="Arial, sans-serif" font-size="13" fill="#222">context</text>
    <text x="309" y="246" font-family="Arial, sans-serif" font-size="13" fill="#222">lag</text>
  </g>
</svg>
