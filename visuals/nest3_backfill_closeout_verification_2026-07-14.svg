<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Nest 3 Backfill Closeout Verification</title>
  <desc id="desc">Public-safe visual summarizing Fusion/Solar and Gases/Liquids/Phases hardening reruns.</desc>
  <rect width="1280" height="760" fill="#f7f5ef"/>
  <text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#172426">Nest 3 Backfill Closeout Verification</text>
  <text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#485457">Fusion/Solar and Gases/Liquids/Phases hard controls reproduced from public-safe runners.</text>

  <defs>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#172426}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#172426}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#334246}
      .metric{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#172426}
      .blue{fill:#e4edf7;stroke:#83a5c5}
      .green{fill:#dcefe9;stroke:#83b5a5}
      .gold{fill:#fff0cf;stroke:#d8b45e}
    </style>
  </defs>

  <g transform="translate(60 150)">
    <rect width="550" height="420" rx="10" class="blue"/>
    <text x="28" y="42" class="title">Fusion + Solar</text>
    <text x="28" y="72" class="small">NASA OMNIWeb / SPDF OMNI2 hourly rows, 2024-2025</text>
    <g transform="translate(28 112)">
      <rect width="150" height="82" rx="8" fill="#ffffff" stroke="#cbd6dc"/>
      <text x="18" y="33" class="metric">17,544</text>
      <text x="18" y="60" class="small">source rows</text>
    </g>
    <g transform="translate(198 112)">
      <rect width="150" height="82" rx="8" fill="#ffffff" stroke="#cbd6dc"/>
      <text x="18" y="33" class="metric">1,133</text>
      <text x="18" y="60" class="small">windows</text>
    </g>
    <g transform="translate(368 112)">
      <rect width="140" height="82" rx="8" fill="#ffffff" stroke="#cbd6dc"/>
      <text x="18" y="33" class="metric">57</text>
      <text x="18" y="60" class="small">event blocks</text>
    </g>
    <g transform="translate(28 230)">
      <text x="0" y="0" class="label">Hardening controls</text>
      <text x="0" y="30" class="small">event-block holdout AUC: 0.998851</text>
      <text x="0" y="54" class="small">balanced accuracy: 0.990582</text>
      <text x="0" y="78" class="small">shuffled-label p: 0.004975</text>
      <text x="0" y="102" class="small">within-month shuffle p: 0.004975</text>
      <text x="0" y="126" class="small">feature-shuffle AUC collapses to 0.501022</text>
    </g>
    <g transform="translate(28 372)">
      <rect width="494" height="28" rx="6" fill="#ffffff" stroke="#cbd6dc"/>
      <text x="14" y="20" class="small">Read: hardened support; window-statistic caveat</text>
    </g>
  </g>

  <g transform="translate(670 150)">
    <rect width="550" height="420" rx="10" class="green"/>
    <text x="28" y="42" class="title">Gases / Liquids / Phases</text>
    <text x="28" y="72" class="small">NIST Chemistry WebBook isobaric supercritical rows</text>
    <g transform="translate(28 112)">
      <rect width="150" height="82" rx="8" fill="#ffffff" stroke="#ccd9d4"/>
      <text x="18" y="33" class="metric">931</text>
      <text x="18" y="60" class="small">records</text>
    </g>
    <g transform="translate(198 112)">
      <rect width="150" height="82" rx="8" fill="#ffffff" stroke="#ccd9d4"/>
      <text x="18" y="33" class="metric">4</text>
      <text x="18" y="60" class="small">species</text>
    </g>
    <g transform="translate(368 112)">
      <rect width="140" height="82" rx="8" fill="#ffffff" stroke="#ccd9d4"/>
      <text x="18" y="33" class="metric">5</text>
      <text x="18" y="60" class="small">pressure bands</text>
    </g>
    <g transform="translate(28 230)">
      <text x="0" y="0" class="label">Hardening controls</text>
      <text x="0" y="30" class="small">species-pressure AUC: 0.996067</text>
      <text x="0" y="54" class="small">balanced accuracy: 0.944275</text>
      <text x="0" y="78" class="small">shuffled-label p: 0.004975</text>
      <text x="0" y="102" class="small">species-heldout AUC: 0.996465</text>
      <text x="0" y="126" class="small">feature-shuffle AUC collapses to 0.485563</text>
    </g>
    <g transform="translate(28 372)">
      <rect width="494" height="28" rx="6" fill="#ffffff" stroke="#ccd9d4"/>
      <text x="14" y="20" class="small">Read: hardened support; pressure-temperature boundary visible</text>
    </g>
  </g>

  <g transform="translate(60 615)">
    <rect width="1160" height="74" rx="8" class="gold"/>
    <text x="24" y="31" class="label">Closeout boundary</text>
    <text x="24" y="56" class="small">These two parked backfill asks are closed at current support level. THz/EMF biology remains pending real source-disabled rows.</text>
  </g>
</svg>
