  <text x="804" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">metadata only</text>
  <text x="952" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">redox transform</text>
  <text x="840" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">High redox state: SHE ORP &gt;= 300 mV</text>
