<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">WQP ORP redox-potential real-data row</title>
  <desc id="desc">Public-safe visual card summarizing WQP ORP redox-potential support metrics for dissolved oxidant chemistry.</desc>
  <rect width="1200" height="680" fill="#f5f1e8"/>
  <text x="54" y="72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#171717">WQP ORP: Dissolved Oxidant Chemistry</text>
  <text x="54" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#404040">Nest 2 oxygen/redox + electrochemistry -&gt; Nest 3 measurement-transform state</text>

  <rect x="54" y="148" width="318" height="154" rx="8" fill="#ffffff" stroke="#d5cbb9"/>
  <text x="78" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#171717">Target QA</text>
  <text x="78" y="218" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">814 ORP support rows</text>
  <text x="78" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">328 site-heldout locations</text>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">2015-01-21 to 2024-02-27</text>

  <rect x="394" y="148" width="356" height="154" rx="8" fill="#ffffff" stroke="#d5cbb9"/>
  <text x="418" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#171717">Measurement Transform</text>
  <text x="418" y="218" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">00090: ORP, reference unspecified</text>
  <text x="418" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">63001: ORP raw EMF</text>
  <text x="418" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">63002: ORP relative to SHE</text>

  <rect x="774" y="148" width="372" height="154" rx="8" fill="#ffffff" stroke="#d5cbb9"/>
  <text x="798" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#171717">Support Read</text>
  <text x="798" y="218" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">site-heldout Pearson 0.995849</text>
  <text x="798" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">high-SHE ORP AUC 0.998237</text>
  <text x="798" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">redox-transform p = 0.003984</text>

  <text x="54" y="358" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#171717">SHE ORP Recovery: Metadata vs Redox Transform</text>
  <line x1="120" y1="572" x2="650" y2="572" stroke="#7d7468" stroke-width="2"/>
  <line x1="120" y1="392" x2="120" y2="572" stroke="#7d7468" stroke-width="2"/>
  <text x="72" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">1.0</text>
  <text x="72" y="484" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">0.5</text>
  <text x="78" y="576" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">0.0</text>
  <rect x="188" y="480" width="94" height="92" fill="#8b8f71"/>
  <rect x="398" y="393" width="94" height="179" fill="#2f9aa7"/>
  <text x="184" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#171717">0.5102</text>
  <text x="394" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#171717">0.9958</text>
  <text x="158" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">metadata only</text>
  <text x="372" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">redox transform</text>
  <text x="215" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">Pearson correlation against shuffled-target controls</text>

  <text x="705" y="358" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#171717">High SHE ORP Class: ROC AUC</text>
  <line x1="760" y1="572" x2="1090" y2="572" stroke="#7d7468" stroke-width="2"/>
  <line x1="760" y1="392" x2="760" y2="572" stroke="#7d7468" stroke-width="2"/>
  <rect x="826" y="462" width="82" height="110" fill="#8b8f71"/>
  <rect x="978" y="393" width="82" height="179" fill="#2f9aa7"/>
